version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: backend-container-sejusc-rh-v3
    ports:
      - "8084:8081"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - MYSQL_HOST=mysql
      - MYSQL_USER=devop
      - MYSQL_PASSWORD=DEVsjc@2025
      - MYSQL_DATABASE=sistema_frequenciarh
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
    container_name: frontend-container-sejusc-rh-v3
    ports:
      - "8081:80"   # <-- alterado aqui

  mysql:
    image: mysql:8.0
    container_name: mysql-container-sejusc-rh-v3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "DEVsjc@2025"
      MYSQL_DATABASE: "sistema_frequenciarh"
    volumes:
      - mysql-data-sejusc-rh-v3:/var/lib/mysql
    ports:
      - "3309:3306"

volumes:
  mysql-data-sejusc-rh-v3:
