services:
  backend:
    build:
      context: ./backend
    container_name: backend-container-sejusc-rh-v3
    restart: unless-stopped
    ports:
      - "8084:8081"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - MYSQL_HOST=mysql
      - MYSQL_USER=devop
      - MYSQL_PASSWORD=DEVsjc@2025
      - MYSQL_DATABASE=sistema_frequenciarh
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: frontend-container-sejusc-rh-v3
    restart: unless-stopped
    ports:
      - "8081:80"   # <-- alterado aqui
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mysql:
    image: mysql:8.0
    container_name: mysql-container-sejusc-rh-v3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "DEVsjc@2025"
      MYSQL_DATABASE: "sistema_frequenciarh"
    volumes:
      - mysql-data-sejusc-rh-v3:/var/lib/mysql
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pDEVsjc@2025"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data-sejusc-rh-v3:
